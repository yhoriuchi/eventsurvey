url: https://yhoriuchi.github.io/eventsurvey/

development:
  mode: release

template:
  bootstrap: 5

home:
  title: eventsurvey
  description: Causal inference for events during survey fieldwork.

navbar:
  structure:
    left: [home, articles, reference, news, faq_page]
    right: [github, issues]
  components:
    faq_page:
      text: "FAQ"
      href: articles/faq.html
    github:
      icon: fab fa-github
      href: https://github.com/yhoriuchi/eventsurvey
      aria-label: GitHub
    issues:
      text: "Issues"
      href: https://github.com/yhoriuchi/eventsurvey/issues

